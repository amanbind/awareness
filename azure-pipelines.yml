trigger:
  branches:
    include:
      - main
      - awareness

pr:
  branches:
    include:
      - main
      - awareness

jobs:
  - job: build_and_test
    displayName: Build, lint, unit, e2e, and baseline audit
    pool:
      vmImage: ubuntu-latest

    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: '20.x'
        displayName: Use Node.js 20

      - checkout: self

      - script: npm ci
        displayName: Install dependencies

      - script: npm run lint
        displayName: Run lint

      - script: npm run test:unit
        displayName: Run unit tests

      - script: npx playwright install --with-deps
        displayName: Install Playwright browsers

      - script: npm run test:e2e
        displayName: Run end-to-end tests

      - script: npm run audit:baseline
        displayName: Run baseline audit
