# oauth2-proxy forward-auth configuration
# This file is imported by Caddyfile

# Public endpoints - no auth required
@public {
    path /health.html
    path /oauth2/*
}

# Protected endpoints - require auth
@protected {
    not path /health.html
    not path /oauth2/*
}

handle @public {
    # No auth needed, pass through
}

handle @protected {
    forward_auth oauth2-proxy:4180 {
        uri /oauth2/auth
        copy_headers {
            X-Auth-Request-User
            X-Auth-Request-Email
            X-Auth-Request-Access-Token
            Set-Cookie
        }
    }
}
